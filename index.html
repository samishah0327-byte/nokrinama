<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NokriNama</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f3ea;--dot:#e2dccb;--surface:#ffffff;--ink:#16211b;--muted:#59655e;--line:#d9ded6;
  --gov:#0f5c3a;--gov-soft:#e1f0e7;--pvt:#9a5b00;--pvt-soft:#fbeed6;--focus:#0b57d0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101612;--dot:#18221b;--surface:#18211b;--ink:#eef2ee;--muted:#a3afa7;--line:#2c3a31;
    --gov:#6fd19b;--gov-soft:#1b3326;--pvt:#f0b45a;--pvt-soft:#3a2b12;--focus:#8ab4f8;
    color-scheme:dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:18px 18px;color:var(--ink);font-family:"Source Sans 3",system-ui,Arial,sans-serif;font-size:17px;line-height:1.5}
html[lang="ur"] body{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:2.1}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 16px;border-radius:16px;border-bottom:4px solid #e3b94b;color:#fff;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 16px),repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 16px),linear-gradient(135deg,#0b3f29,#0f5c3a)}
h1{margin:0;font-size:1.6rem;line-height:1.2;color:#fff}
html[lang="ur"] h1{line-height:1.8}
.sub{margin:4px 0 0;color:rgba(255,255,255,.88)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:52px;height:52px;flex-shrink:0}
.logo rect:nth-child(1){fill:#e3b94b}
.logo path:nth-child(2){stroke:#0b3f29}
.logo rect:nth-child(3){fill:#0b3f29}
.logo path:nth-child(4){stroke:#e3b94b}
.logo rect:nth-child(5){fill:#e3b94b}
.lang{display:flex;border:1.5px solid #e3b94b;border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{font:inherit;font-size:.9rem;line-height:1.2;padding:8px 14px;border:0;background:transparent;color:#fff;cursor:pointer}
.lang button[aria-pressed="true"]{background:#e3b94b;color:#0b3f29;font-weight:700}
input[type=search]{width:100%;margin:18px 0 12px;padding:12px 14px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
select{width:100%;margin:0 0 12px;padding:12px 14px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chips button{font:inherit;font-size:.95rem;line-height:1.3;padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--gov);background:var(--gov-soft);color:var(--gov);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
details{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--gov);border-radius:8px;margin-bottom:10px;box-shadow:0 1px 4px rgba(11,63,41,.10)}
details[open]{box-shadow:0 4px 14px rgba(11,63,41,.16)}
details.private{border-inline-start-color:var(--pvt)}
summary{list-style:none;cursor:pointer;padding:12px 14px}
summary::-webkit-details-marker{display:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.jt{font-weight:700;font-size:1.1rem}
.tag{font-size:.8rem;line-height:1.4;padding:2px 10px;border-radius:999px;background:var(--gov-soft);color:var(--gov);white-space:nowrap}
.private .tag{background:var(--pvt-soft);color:var(--pvt)}
.meta{color:var(--muted);font-size:.95rem;margin-top:2px}
.more{padding:0 14px 14px;border-top:1px solid var(--line)}
.more h2{font-size:.95rem;margin:12px 0 2px;color:var(--muted)}
.more p{margin:0}
.ad{margin:12px 0 4px;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ad img{display:block;width:100%;cursor:zoom-in}
.ad.zoom img{width:200%;cursor:zoom-out}
.adhint{font-size:.85rem;color:var(--muted);margin:2px 0 0}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.note{margin-top:24px;font-size:.85rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="NokriNama logo">
        <rect width="48" height="48" rx="12" fill="var(--gov)"/>
        <path d="M18 19v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linecap="round"/>
        <rect x="10" y="19" width="28" height="19" rx="4" fill="var(--bg)"/>
        <path d="M10 27h28" stroke="var(--gov)" stroke-width="2.5"/>
        <rect x="21" y="25" width="6" height="5" rx="1.5" fill="var(--gov)"/>
      </svg>
      <div>
        <h1 id="t-title"></h1>
        <p class="sub" id="t-sub"></p>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="b-en" type="button">English</button>
      <button id="b-ur" type="button" lang="ur">اردو</button>
    </div>
  </header>
  <input type="search" id="q">
  <select id="prov"></select>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <p class="note" id="t-note"></p>
</div>

  punjab:{en:"Punjab", ur:"پنجاب"},
  sindh:{en:"Sindh", ur:"سندھ"},

  balochistan:{en:"Balochistan", ur:"بلوچستان"},
  islamabad:{en:"Islamabad", ur:"اسلام آباد"},
  gb:{en:"Gilgit-Baltistan", ur:"گلگت بلتستان"},
  ajk:{en:"Azad Kashmir", ur:"آزاد کشمیر"}
};
var prov = "all", lang = "en", filter = "all";
try { var saved = localStorage.getItem("lang"); if (saved === "ur" || saved === "en") lang = saved; } catch (e) {}

function fmtDate(d) {
  try { return new Date(d + "T00:00:00").toLocaleDateString(lang === "ur" ? "ur-PK" : "en-GB", {day:"numeric", month:"long", year:"numeric"}); }
  catch (e) { return d; }
}

function render() {
  var t = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("t-note").textContent = t.note;
  document.getElementById("q").placeholder = t.search;
  document.getElementById("q").setAttribute("aria-label", t.search);
  document.getElementById("b-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("b-ur").setAttribute("aria-pressed", lang === "ur");

  var chips = "";
  ["all", "government", "private"].forEach(function (k) {
    chips += '<button type="button" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' + t[k] + "</button>";
  });
  document.getElementById("chips").innerHTML = chips;
  var opts = '<option value="all">' + t.provAll + "</option>";
  Object.keys(PROV).forEach(function (k) {
    opts += '<option value="' + k + '"' + (prov === k ? " selected" : "") + ">" + PROV[k][lang] + "</option>";
  });
  document.getElementById("prov").innerHTML = opts;

  var term = document.getElementById("q").value.trim().toLowerCase();
  var html = "";
  JOBS.forEach(function (j) {
    var x = j[lang];
    if (filter !== "all" && j.type !== filter) return;
    if (prov !== "all" && j.prov !== prov) return;
    var hay = (j.en.title + j.en.org + j.en.city + j.ur.title + j.ur.org + j.ur.city).toLowerCase();
    if (term && hay.indexOf(term) === -1) return;
    html += '<details class="' + j.type + '"><summary><div class="row"><span class="jt">' + x.title +
      '</span><span class="tag">' + t[j.type] + '</span></div><div class="meta">' + x.org + " – " + (x.city === PROV[j.prov][lang] ? x.city : x.city + (lang === "ur" ? "، " : ", ") + PROV[j.prov][lang]) +
      '</div><div class="meta">' + t.last + ": " + fmtDate(j.date) + '</div></summary><div class="more">' +
      (j.img ? '<div class="ad"><img src="' + j.img + '" alt="' + t.photo + '"></div><p class="adhint">' + t.photo + '</p>' : '') +
      '<h2>' + t.how + "</h2><p>" + x.how + "</p></div></details>";
  });
  document.getElementById("list").innerHTML = html || '<p class="empty">' + t.none + "</p>";
}

document.getElementById("b-en").onclick = function () { lang = "en"; try { localStorage.setItem("lang", lang); } catch (e) {} render(); };
document.getElementById("b-ur").onclick = function () { lang = "ur"; try { localStorage.setItem("lang", lang); } catch (e) {} render(); };
document.getElementById("q").oninput = render;
document.getElementById("prov").onchange = function () { prov = this.value; render(); };
document.getElementById("chips").onclick = function (e) {
  var f = e.target.getAttribute("data-f");
  if (f) { filter = f; render(); }
};
document.getElementById("list").addEventListener("click", function (e) {
  if (e.target.tagName === "IMG") e.target.parentNode.classList.toggle("zoom");
});
render();
